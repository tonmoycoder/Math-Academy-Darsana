  কেন Noto Sans Bengali (Hind Siliguri-র বদলে):
    • variable font — 400/600/700/800 সব ওজন একই ফাইল থেকে, তাই নরম-মোটা

================================================================================
৫. প্রতিটি ইন্টার‌্যাক্টিভ উপাদান — কে কী করে
--------------------------------------------------------------------------------
  [data-wa="..."] (১২টি)
      যে-ই ক্লিক করুক → wa.me/<নম্বর>?text=<URL-encoded বাংলা মেসেজ> নতুন ট্যাবে।
      মেসেজটা প্রতিটি বাটনের জন্য আলাদা (হেডার / ব্যাচ / শিক্ষক / ফুটার)।
      সোর্স: site.js → $$('[data-wa]').forEach(...) ; WA_NUMBER কনস্ট্যান্ট।

  #burger → .drawer
      মোবাইল মেনু; aria-expanded true/false; drawer-এর লিংকে ক্লিক করলে বন্ধ +
      স্ক্রল; Esc চাপলেও বন্ধ।

  নেভ লিংক + সব a[href^="#"]
      smooth scroll, হেডারের আসল উচ্চতা মেপে offset (fixed 78px নয়)।
      URL hash history.replaceState দিয়ে আপডেট (try/catch — sandbox safe)।

  Method Lab — [data-problem="0..3"]
      ৪টি প্রোব্লেম অবজেক্ট site.js-এর প্রোব্লেম অ্যারেতে; ক্লিক করলে
      #labQ (প্রশ্ন), #badSteps / #goodSteps (ধাপ), মিটার (#badTime,
      #goodTime, #badRiskPct, #goodRiskPct), #labWhy (কেন কাজ করে) বদলায়।
      নতুন প্রশ্ন যোগ করতে চাইলে শুধু অ্যারে-এ একটা আইটেম + একটা বাটন।

  Live lab — [data-tool="circle|tri|pyth|unit"]
      ট্যাব বদলায় (#panel-*), প্রতিটি টুল নিজের SVG জ্যামিতি রিসাইজ করে:
        • বৃত্ত: #rRange (r=2–8), #dRange (d=0–10) → সেক্যান্ট/ট্যানজেন্ট/মিস
        • ত্রিভুজ: #aRange/#bRange (A,B কোণ), প্রিসেট 60/60, 90/45, 120/30 →
          C=180−A−B, ধরন (সমবাহু/সমদ্বিবাহু/স্থূলকোণী...)
        • পিথাগোরাস: #paRange/#pbRange (a,b = 2–6) → তিনটি বর্গ এঁকে
          a²+b²=c² দেখায়, প্রিসেট 3-4-5, 6-8-10, 5-5
        • একক বৃত্ত: #thetaRange (0–360, step 5) → sin/cos/tan + চতুর্ভাগ

  #library [data-filter="all|ssc|class|geometry|formula"]
      .sheet কার্ড ফিল্টার। এখন toast দেখায় — আসল PDF হলে href বসবে।

  #lookupForm (রোল লুকআপ)
      ইনপুট normalize → site.js-এর data{} অবজেক্টে খোঁজে। পাওয়া গেলে

     CSS ভেরিয়েবল --mx/--sx/--tx/--qx (+ --my/--sy/--ty/--qy)। কোনো layout
     পড়া/লেখা হয় না, শুধু কম্পোজিটর-বান্ধব var আপডেট; পজিশন ০.২%-এর ভিতরে
     এলে rAF থেমে যায় (ব্যটারি বাঁচে)।
   • mask-image-এ hard-ish স্টপ (#000 58% → transparent 62%) — নরম স্টপ দিলে
     ছবি ঘোলা দেখায়, আর একাধিকलेयर Chromium-এ add হয়ে যায়।
   • টাচ/কম-মোশন: পয়েন্টার ম্যাথ বন্ধ, বদলে ৯০ms-এ ধীরে শ্বাস নেওয়া পুল
     (--mx/--my/--sx/--sy) — ফোনেও ছবিটা জীবন্ত দেখায়, কিন্তু খরচ কম।
   • ভুল পথ (আবার চেষ্টা করবেন না): SVG feTurbulence + feDisplacementMap দিয়ে
     "তরল" বানানো — রিভিল লেয়ার ধুয়ে ফেলে, ফিল্টার-বক্স দেখা যায়।

B. ক্লিক/ট্যাপ অ্যাফোর্ড্যান্স (মোবাইলে সবচেয়ে জরুরি)
   • নিয়ম: যে জিনিসে চাপ দেওয়া যায়, তার ৩টি লক্ষণ থাকবে — (১) বর্ডার/শ্যাডো
     দিয়ে "বাটন" বোঝা যায়, (২) hover/active/focus-visible অবস্থা আলাদা,
     (৩) ছোট লেবেল বা ডট দিয়ে ইঙ্গিত। শুধু cursor:pointer যথেষ্ট নয়।
   • .tapdot — vermillion ডট + pulse (কম-মোশনে বন্ধ)।
   • .tap-hint — ল্যাবের ট্যাবের উপরে এক লাইনের নির্দেশ।
   • Method-lab ৪টি উদাহরণ (.lab__switch button): নিয়মিত চিপ, selected-এ ink
     ব্যাকগ্রাউন্ড + নিচে লাল ডায়মন্ড; মোবাইলে ২×২ গ্রিড (কিছু স্ক্রল-আউট হয় না)।
   • ল্যাব টুল ট্যাব (.tab): unselected-এও বর্ডার + mint নম্বর, selected-এ
     paper ব্যাকগ্রাউন্ড + 4px লাল শ্যাডো; মোবাইলে ২×২।
   • বই/লাইব্রেরি চিপ, রেঞ্জ স্লাইডার (মোবাইলে ৩০px থাম্ব), FAQ, ব্যাচ সারি —
     সবগুলোর ট্যাপ-টার্গেট ≥44px এবং :active প্রতিক্রিয়া আছে।
   • aria: tablist/tab/aria-selected, aria-pressed, aria-label="… ট্যাপ করুন"।

C. SEO স্ট্যাক (মাথায় রাখুন — একটাই পেজ, তাই সব সিগন্যাল এখানেই)
   • <html lang="bn-BD">, title (~৬০ অক্ষর), description ১৪২ অক্ষর,
     keywords, author, robots, geo.region/placename/position/ICBM, canonical, hreflang.
   • Open Graph + Twitter card (og:image 1200×630 আলাদা ফাইল হিসেবে আপলোড করুন)।
   • JSON-LD @graph: EducationalOrganization (ঠিকানা, geo, openingHours, areaServed
     দর্শনা/চুয়াডাঙ্গা), Person (প্রান্ত রাই), Course + CourseInstance,
     WebSite, FAQPage (৪টি প্রশ্ন), BreadcrumbList।
   • robots.txt + sitemap.xml (dist/ এ কপি হয়)।
   • H1 একটাই, H2 সেকশনভিত্তিক, প্রতিটি ছবিতে অর্থপূর্ণ alt, বাটনে লেখা।
   • টার্গেট কোয়েরি: ম্যাথ একাডেমি, ম্যাথ একাডেমি দর্শনা, প্রান্ত রাই,
     দর্শনায় গণিত শিক্ষক, চুয়াডাঙ্গা গণিত কোচিং/টিউটর, SSC গণিত কোচিং চুয়াডাঙ্গা।
   • লাইভে যাওয়ার পর: Google Search Console-এ sitemap জমা, Business Profile
     (দর্শনা), NAP (নাম-ঠিকানা-ফোন) সব জায়গায় হুবহু এক।

D. পারফরম্যান্স বাজেট ও সিদ্ধান্ত
   • লোড পথ: HTML(gz ~87KB) → critical CSS inline → Bengali font preload → hero webp।
   • ফন্ট: ৬টি @font-face, Bengali variable face ৯১KB (সাবসেট, ৬৭ অক্ষর) —
     preload + font-display:block; লাতিন ফেসগুলো ১৩–১৬KB।
   • CLS: "BN Metric" নামে একটা metric-matched ফলব্যাক ফেস (size-adjust 83.2%,
     ascent 110.2%, descent 49%) — ফন্ট বদলালেও লাইন-বক্স একই থাকে। উপরে
     html.fonts-loading → body visibility:hidden; ফন্ট রেডি হলে ক্লাস যায়।
     ফলে fallback কখনো পেইন্ট হয় না, swap-জনিত শিফট হয় না।
   • Preloader ~১.২৮ সেকেন্ডে শেষ (শাটার ০.৮৬→১.২৮s); hero intro shutter-এর
     পেছনেই চলে, তাই প্রথম রঙিন পেইন্টটাই আসল হেডলাইন → LCP ভালো থাকে।
   • ?fast=1 (বা second visit in session) → intro স্কিপ, সাথে সাথে পেজ।
   • Lighthouse (মোবাইল থ্রটল): SEO 100 · Accessibility 100 · Best Practices 100;
     Performance ~৯৩–৯৬ (বাকিটা LCP, যা ৯১KB বাংলা ফন্ট + ১.২৮s ব্র্যান্ডেড
     intro-র জন্য; ?fast=1 দিলে LCP কমে)। কোনো ডিজাইন বদল না করে এর বেশি
     তোলার উপায় নেই — কারণ LCP ফন্ট ডাউনলোডেই আটকে থাকে।

E. বিল্ড ও ডিপ্লয় (আপডেট পাথ "দ্রুত" রাখার জন্য)
   • python3 _src/build.py            → math-academy.html  (এক ফাইল, offline ডেমো)
   • python3 _src/build.py --publish  → dist/  (index.html + assets/ + robots + sitemap)
   • dist/index.html ~২৯৪KB (gz ~৮৭KB) + ৭টি ইমেজ + ৩টি ফন্ট; রিভিজিটে ক্যাশ।
   • হোস্টিং: Netlify/Vercel/Cloudflare Pages/যেকোনো স্ট্যাটিক; বিল্ড স্টেপ নেই।
     নিয়ম: HTML-এ no-cache বা short TTL, assets/-এ 1 বছর immutable।
   • কনটেন্ট বদলাতে হলে _src/ ফাইল এডিট → rebuild → আপলোড। কোনো CMS/DB লাগে না।
